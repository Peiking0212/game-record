    <meta property="og:title" content="游戏记录 - 游戏详情">
    <meta property="og:description" content="查看某款游戏的全部相关内容。">
    <meta property="og:type" content="website">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <title>游戏详情 - 游戏记录</title>
    <style>
.desktop-nav { display: none; }
.mobile-nav { display: flex; }
.mobile-menu { display: none; }
@media (min-width: 768px) {
    .desktop-nav { display: flex; }
    .mobile-nav { display: none; }
}
</style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.544.0/dist/umd/lucide.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
    <header class="bg-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <nav class="flex items-center justify-between py-4">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-r from-[#52B6FF] to-[#94D8FF] rounded-lg flex-shrink-0 flex items-center justify-center"><i data-lucide="gamepad-2" class="text-white w-5 h-5"></i></div>
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-[#52B6FF] to-[#94D8FF] bg-clip-text text-transparent">游戏记录</h1>
                </div>
                <div class="desktop-nav items-center space-x-3">
                    <a href="index.html" class="nav-link"><i data-lucide="home" class="w-5 h-5 inline mr-2"></i>首页</a>
                    <a href="profile.html" class="nav-link"><i data-lucide="user" class="w-5 h-5 inline mr-2"></i>个人简介</a>
                    <a href="games.html" class="nav-link active"><i data-lucide="gamepad-2" class="w-5 h-5 inline mr-2"></i>游戏收藏</a>
                    <a href="achievements.html" class="nav-link"><i data-lucide="trophy" class="w-5 h-5 inline mr-2"></i>成就系统</a>
                    <a href="stats.html" class="nav-link"><i data-lucide="bar-chart-3" class="w-5 h-5 inline mr-2"></i>数据统计</a>
                    <a href="report.html" class="nav-link"><i data-lucide="sparkles" class="w-5 h-5 inline mr-2"></i>年度报告</a>
                    <a href="spending.html" class="nav-link"><i data-lucide="shopping-cart" class="w-5 h-5 inline mr-2"></i>消费记录</a>
                    <div style="position:relative;" id="nav-more-wrap">
                        <a href="#" class="nav-link" id="nav-more-btn" onclick="event.preventDefault();document.getElementById('nav-more-menu').classList.toggle('hidden')">
                            <i data-lucide="more-horizontal" class="w-5 h-5 inline mr-2"></i>更多
                        </a>
                        <div id="nav-more-menu" class="hidden" style="position:absolute;top:100%;right:0;background:var(--bg-card);border:1px solid var(--border-light);border-radius:0.75rem;box-shadow:0 8px 24px var(--shadow-color);z-index:60;min-width:160px;padding:0.5rem;">
                            <a href="gallery.html" class="nav-link" style="display:flex;align-items:center;padding:0.5rem 1rem;border-radius:0.5rem;white-space:nowrap;"><i data-lucide="image" class="w-4 h-4 inline mr-2"></i>媒体库</a>
                            <a href="wishlist.html" class="nav-link" style="display:flex;align-items:center;padding:0.5rem 1rem;border-radius:0.5rem;white-space:nowrap;"><i data-lucide="heart" class="w-4 h-4 inline mr-2"></i>游戏愿望单</a>
                            <a href="reviews.html" class="nav-link" style="display:flex;align-items:center;padding:0.5rem 1rem;border-radius:0.5rem;white-space:nowrap;"><i data-lucide="message-square" class="w-4 h-4 inline mr-2"></i>游戏评测</a>
                        </div>
                    </div>
                </div>
                <button class="mobile-nav text-gray-700 hover:text-blue-500" id="mobile-menu-toggle">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </nav>
            <div class="mobile-menu" id="mobile-menu">
                <div class="flex flex-col space-y-2 pb-2">
                    <a href="index.html" class="nav-link py-2 px-4 rounded-lg"><i data-lucide="home" class="w-4 h-4 inline mr-2"></i>首页</a>
                    <a href="profile.html" class="nav-link py-2 px-4 rounded-lg"><i data-lucide="user" class="w-4 h-4 inline mr-2"></i>个人简介</a>
                    <a href="games.html" class="nav-link py-2 px-4 rounded-lg active"><i data-lucide="gamepad-2" class="w-4 h-4 inline mr-2"></i>游戏收藏</a>
                    <a href="achievements.html" class="nav-link py-2 px-4 rounded-lg"><i data-lucide="trophy" class="w-4 h-4 inline mr-2"></i>成就系统</a>
                    <a href="stats.html" class="nav-link py-2 px-4 rounded-lg"><i data-lucide="bar-chart-3" class="w-4 h-4 inline mr-2"></i>数据统计</a>
                    <a href="report.html" class="nav-link py-2 px-4 rounded-lg"><i data-lucide="sparkles" class="w-4 h-4 inline mr-2"></i>年度报告</a>
                    <a href="spending.html" class="nav-link py-2 px-4 rounded-lg"><i data-lucide="shopping-cart" class="w-4 h-4 inline mr-2"></i>消费记录</a>
                    <a href="gallery.html" class="nav-link py-2 px-4 rounded-lg"><i data-lucide="image" class="w-4 h-4 inline mr-2"></i>媒体库</a>
                    <a href="wishlist.html" class="nav-link py-2 px-4 rounded-lg"><i data-lucide="heart" class="w-4 h-4 inline mr-2"></i>游戏愿望单</a>
                    <a href="reviews.html" class="nav-link py-2 px-4 rounded-lg"><i data-lucide="message-square" class="w-4 h-4 inline mr-2"></i>游戏评测</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Not Found -->
    <section id="game-not-found" class="py-24 hidden">
        <div class="container mx-auto px-4 text-center max-w-lg">
            <i data-lucide="search-x" class="w-20 h-20 text-gray-300 mx-auto mb-6"></i>
            <h2 class="text-3xl font-bold text-gray-800 mb-4">未找到该游戏</h2>
            <p class="text-gray-600 mb-8" id="not-found-message">请检查链接是否正确，或返回游戏收藏页浏览。</p>
            <a href="games.html" class="btn-primary inline-flex items-center">
                <i data-lucide="arrow-left" class="w-5 h-5 inline mr-2"></i>
                返回游戏收藏
            </a>
        </div>
    </section>

    <!-- Game Hub Content -->
    <div id="game-hub-content" class="hidden">
        <!-- Hero -->
        <section class="game-hub-hero bg-gradient-to-br from-blue-50 to-cyan-100 py-10 md:py-16">
            <div class="container mx-auto px-4">
                <a href="games.html" class="game-hub-back inline-flex items-center text-sm text-gray-600 hover:text-blue-600 mb-6">
                    <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i>返回游戏收藏
                </a>
                <div class="game-hub-hero-grid">
                    <div class="game-hub-cover" id="game-hero-cover"></div>
                    <div class="game-hub-hero-info">
                        <div class="flex flex-wrap items-center gap-3 mb-3">
                            <span id="game-hero-type" class="game-hub-tag"></span>
                            <span id="game-hero-status" class="game-hub-status"></span>
                        </div>
                        <h1 id="game-hero-name" class="text-3xl md:text-4xl font-bold text-gray-800 mb-4"></h1>
                        <p id="game-hero-desc" class="text-gray-600 mb-6 max-w-2xl"></p>
                        <div class="game-hub-stats-row" id="game-quick-stats"></div>
                        <div class="game-hub-progress-wrap mt-6">
                            <div class="flex justify-between text-sm text-gray-600 mb-2">
                                <span>完成进度</span>
                                <span id="game-progress-label">0%</span>
                            </div>
                            <div class="game-hub-progress-bar">
                                <div id="game-progress-fill" class="game-hub-progress-fill" style="width:0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Sections -->
        <main class="py-12 bg-white">
            <div class="container mx-auto px-4 max-w-6xl space-y-10">
                <section class="game-hub-section" id="section-reviews">
                    <div class="game-hub-section-header">
                        <h2><i data-lucide="message-square" class="w-5 h-5"></i>游戏评测</h2>
                        <a href="reviews.html" class="game-hub-section-link">查看全部</a>
                    </div>
                    <div id="game-reviews-list" class="game-hub-list"></div>
                </section>

                <section class="game-hub-section" id="section-achievements">
                    <div class="game-hub-section-header">
                        <h2><i data-lucide="trophy" class="w-5 h-5"></i>成就记录</h2>
                        <a href="achievements.html" class="game-hub-section-link">查看全部</a>
                    </div>
                    <div id="game-achievements-list" class="game-hub-achievements-grid"></div>
                </section>

                <section class="game-hub-section" id="section-screenshots">
                    <div class="game-hub-section-header">
                        <h2><i data-lucide="camera" class="w-5 h-5"></i>游戏截图与视频</h2>
                        <a href="gallery.html" class="game-hub-section-link">媒体库</a>
                    </div>
                    <div id="game-screenshots-grid" class="media-gallery"></div>
                </section>

                <section class="game-hub-section" id="section-spending">
                    <div class="game-hub-section-header">
                        <h2><i data-lucide="shopping-cart" class="w-5 h-5"></i>消费记录</h2>
                        <a href="spending.html" class="game-hub-section-link">查看全部</a>
                    </div>
                    <div id="game-spending-summary" class="game-hub-spending-summary"></div>
                    <div id="game-spending-list" class="game-hub-spending-table-wrap"></div>
                </section>

            </div>
        </main>
    </div>

    <footer class="bg-gray-800 text-white py-12">
        <div class="container mx-auto px-4 text-center text-gray-400">
            <p>&copy; <span id="current-year"></span> 游戏记录. All rights reserved.</p>
        </div>
    </footer>

    <script>
        lucide.createIcons();
        AOS.init({ duration: 800, once: true });
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/sample-data-utils.js?v=1"></script>
    <script src="js/data.js?v=2"></script>
    <script src="js/cloud-sync.js?v=3"></script>
    <script src="utils.js?v=7"></script>
    <script src="js/game-detail.js?v=6"></script>
    <script src="theme.js?v=8"></script>
</body>
</html>
