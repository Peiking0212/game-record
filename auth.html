<body class="auth-page-body">
    <div class="auth-page-wrap">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="auth-logo-icon">🎮</div>
                <h1>游戏记录</h1>
                <p>登录后同步你的游戏数据</p>
            </div>

            <div id="auth-message" class="auth-message hidden" role="alert"></div>

            <form id="auth-form" class="auth-form">
                <label for="auth-email">邮箱</label>
                <input id="auth-email" type="email" name="email" autocomplete="email" required placeholder="you@example.com">

                <label for="auth-password">密码</label>
                <input id="auth-password" type="password" name="password" autocomplete="current-password" required minlength="6" placeholder="至少 6 位">

                <button id="auth-submit" type="submit" class="btn-primary w-full">登录</button>
            </form>

            <div class="auth-switch">
                <span id="auth-mode-label">还没有账号？</span>
                <button id="auth-toggle-mode" type="button" class="auth-link-btn">注册</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/lib/supabase-browser.js"></script>
    <script src="js/supabase.js"></script>
